# Deploy the static map (outputs/map/) to GitHub Pages (T5.1).
# No build step: the site and its data files are committed. Data files are
# regenerated from the frozen results with
#   python -I src/portgaps/map/build_map_data.py
# Requires: repo Settings -> Pages -> Source = "GitHub Actions".
name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "outputs/map/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: outputs/map
      - id: deployment
        uses: actions/deploy-pages@v5
